<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Màn Chiếu NestedCanvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- KaTeX for Mathematics Display -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #090d13;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f0f6fc;
        user-select: none;
      }

      body.hide-cursor, body.hide-cursor * {
        cursor: none !important;
      }

      #app-display {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .display-canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #display-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        pointer-events: none !important; /* Hoàn toàn không tương tác */
      }

      #display-video-overlays { position:absolute; inset:0; z-index:8; pointer-events:none; }
      #display-video-overlays iframe { position:absolute; border:0; border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.35); }

      /* Màn hình chờ - chỉ hiện thoáng qua khi chưa có bất kỳ dữ liệu canvas nào */
      #idle-overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d13;
        transition: opacity 0.3s ease;
      }

      #idle-overlay.hidden {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .idle-pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #58a6ff;
        box-shadow: 0 0 12px #58a6ff;
        animation: pulseRing 1.8s ease-in-out infinite;
      }

      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 0.3; }
      }
    </style>
  </head>
  <body class="hide-cursor">
    <div id="app-display">
      <!-- Fullscreen Non-Interactive Mirror Canvas -->
      <div class="display-canvas-container" id="display-canvas-container">
        <canvas id="display-canvas"></canvas>
      </div>
      <div id="display-video-overlays" aria-hidden="true"></div>
      <!-- Floating Page Transition Toast (Hiển thị nhẹ 2.5s khi chuyển trang) -->
      <div id="display-page-toast" style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 100; padding: 5px 14px; background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(88, 166, 255, 0.4); border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); backdrop-filter: blur(16px); color: #f0f6fc; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; pointer-events: none; opacity: 0; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 6px;">
        <span id="display-toast-icon">📄</span>
        <span id="display-toast-text">Trang 1</span>
      </div>

      <!-- Màn hình chờ chuyên nghiệp (tự động ẩn khi có nét vẽ hoặc bảng được chiếu) -->
      <div id="idle-overlay">
        <div class="glass-panel" style="background: rgba(13, 17, 23, 0.92); border: 1px solid rgba(88, 166, 255, 0.3); border-radius: 20px; padding: 36px 44px; text-align: center; max-width: 520px; box-shadow: 0 24px 60px rgba(0,0,0,0.8); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div style="width: 64px; height: 64px; border-radius: 18px; background: rgba(88, 166, 255, 0.12); border: 1px solid rgba(88, 166, 255, 0.35); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 24px rgba(88,166,255,0.2);">
            🖥️
          </div>
          
          <div>
            <h1 style="font-size: 22px; font-weight: 700; color: #f0f6fc; margin: 0 0 6px 0; letter-spacing: -0.3px;">Màn Chiếu NestedCanvas</h1>
            <p style="font-size: 13.5px; color: #8b949e; margin: 0; line-height: 1.5;">
              Màn hình phụ thời gian thực không tương tác. Tự động đồng bộ nét vẽ và bảng con từ điện thoại hoặc máy tính bảng.
            </p>
          </div>

          <div id="idle-status-box" style="display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: rgba(56, 139, 253, 0.1); border: 1px solid rgba(56, 139, 253, 0.25); border-radius: 30px; font-size: 13px; color: #58a6ff; font-weight: 500;">
            <div class="idle-pulse" id="idle-status-dot"></div>
            <span id="idle-status-text">Đang kết nối máy chủ đồng bộ LAN...</span>
          </div>

          <div style="border-top: 1px solid rgba(255,255,255,0.08); width: 100%; padding-top: 14px; margin-top: 4px; display: flex; justify-content: space-around; font-size: 11.5px; color: #6e7681;">
            <span>⌨️ <b>F11</b> Toàn màn hình</span>
            <span>⌨️ <b>Esc</b> Thu nhỏ</span>
            <span>🔄 <b>Ctrl+R</b> Tải lại</span>
            <span>🧹 <b>Ctrl+Del</b> Xóa bảng</span>
          </div>
        </div>
      </div>

      <!-- Góc thông báo trạng thái nhẹ nhàng (Floating status pill) -->
      <div id="display-status-pill" style="position: absolute; bottom: 10px; right: 10px; z-index: 40; padding: 4px 10px; background: rgba(13, 17, 23, 0.75); border: 1px solid rgba(88, 166, 255, 0.2); border-radius: 14px; font-size: 9.5px; color: #8b949e; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); pointer-events: none; transition: opacity 0.4s ease; opacity: 0.85;">
        <span id="display-pill-dot" style="width: 5px; height: 5px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 4px #3fb950;"></span>
        <span id="display-pill-page" style="font-weight: 600; color: #58a6ff;">Trang 1 / 1</span>
        <span style="opacity: 0.35;">•</span>
        <span id="display-pill-text">Màn chiếu sẵn sàng</span>
      </div>
    </div>

    <script type="module" src="/src/display.js"></script>
  </body>
</html>

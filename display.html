<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Màn Chiếu NestedCanvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- KaTeX for Mathematics Display -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #090d13;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f0f6fc;
        user-select: none;
        cursor: none !important; /* Không hiển thị con trỏ chuột trên màn chiếu */
      }

      #app-display {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: none !important;
      }

      .display-canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        cursor: none !important;
      }

      #display-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        pointer-events: none !important; /* Hoàn toàn không tương tác */
        cursor: none !important;
      }

      /* Màn hình chờ - chỉ hiện thoáng qua khi chưa có bất kỳ dữ liệu canvas nào */
      #idle-overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d13;
        transition: opacity 0.3s ease;
      }

      #idle-overlay.hidden {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .idle-pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #58a6ff;
        box-shadow: 0 0 12px #58a6ff;
        animation: pulseRing 1.8s ease-in-out infinite;
      }

      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div id="app-display">
      <!-- Fullscreen Non-Interactive Mirror Canvas -->
      <div class="display-canvas-container" id="display-canvas-container">
        <canvas id="display-canvas"></canvas>
      </div>

      <!-- Màn hình chờ đơn giản khi bắt đầu (tự ẩn ngay khi có dữ liệu) -->
      <div id="idle-overlay" class="hidden">
        <div style="display: flex; align-items: center; gap: 14px; color: #8b949e; font-size: 16px; font-weight: 500;">
          <div class="idle-pulse"></div>
          <span>Đang kết nối màn chiếu...</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/display.js"></script>
  </body>
</html>
